name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: entrelinhas_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/entrelinhas_teste
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check app testes
          ruff format --check app testes
      - name: Testes (sem rede, sem chaves; implementações falsas)
        run: pytest testes -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Código gerado está em dia
        run: |
          dart run build_runner build -d
          git diff --exit-code -- lib
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
