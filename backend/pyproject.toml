[project]
name = "entrelinhas-backend"
version = "0.1.0"
description = "API, motor de análise e reconhecimento do Entrelinhas"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]",
  "pgvector",
  "pydantic>=2",
  "pydantic-settings",
  "httpx",
  "argon2-cffi",
  "pyjwt[crypto]",
  "redis",
  "rq",
  "boto3",
  "pillow",
  "numpy",
  "opencv-python-headless",
  "zxing-cpp",
  "pytesseract",
  "reportlab",
  "python-multipart",
]

[project.optional-dependencies]
ml = ["torch", "torchvision", "transformers"]
dev = ["pytest", "pytest-asyncio", "ruff", "respx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-q"
