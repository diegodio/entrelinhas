# Ambiente local completo: banco (com pgvector), Redis, MinIO, API e worker.
#   docker compose up --build
#   docker compose exec api python -m app.demo      # dados de demonstração
# O app web é servido à parte (ver docs/como-rodar.md).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: entrelinhas
      POSTGRES_PASSWORD: entrelinhas
      POSTGRES_DB: entrelinhas
    ports: ["5432:5432"]
    volumes: [dados_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrelinhas"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: entrelinhas
      MINIO_ROOT_PASSWORD: entrelinhas-local
    ports: ["9000:9000", "9001:9001"]
    volumes: [dados_minio:/data]

  minio-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 entrelinhas entrelinhas-local
      && mc mb --ignore-existing local/entrelinhas"

  api:
    build: ./backend
    env_file: [.env]
    environment: &ambiente
      DATABASE_URL: postgresql+psycopg://entrelinhas:entrelinhas@db:5432/entrelinhas
      REDIS_URL: redis://redis:6379/0
      TAREFAS_MODO: fila
      ARMAZENAMENTO: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: entrelinhas
      S3_CHAVE: entrelinhas
      S3_SEGREDO: entrelinhas-local
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8000:8000"]

  worker:
    build: ./backend
    env_file: [.env]
    environment: *ambiente
    command: ["python", "-m", "app.worker"]
    depends_on: [api, redis]

volumes:
  dados_db:
  dados_minio:
